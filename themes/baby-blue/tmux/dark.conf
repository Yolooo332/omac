# Baby Blue dark for tmux. Generated by themes/omac-ports.py from baby-blue/palette.json. Edit the palette, not this file.
set -g status-style "bg=default,fg=#e8e8e8"
set -g status-left "#[fg=#181818,bg=#89CFF0,bold] #S #[bg=default] "
set -g status-right "#[fg=#89CFF0]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#808080]#h "
set -g window-status-format "#[fg=#808080] #I:#W "
set -g window-status-current-format "#[fg=#89CFF0,bold] #I:#W "
set -g pane-border-style "fg=#383838"
set -g pane-active-border-style "fg=#89CFF0"
set -g message-style "bg=default,fg=#89CFF0"
set -g message-command-style "bg=default,fg=#89CFF0"
set -g mode-style "bg=#3d2f2f,fg=#e8e8e8"
setw -g clock-mode-colour "#89CFF0"
