# Baby Blue white for tmux. Generated by themes/omac-ports.py from baby-blue/palette.json. Edit the palette, not this file.
set -g status-style "bg=default,fg=#202020"
set -g status-left "#[fg=#181818,bg=#89CFF0,bold] #S #[bg=default] "
set -g status-right "#[fg=#1677a8]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#8a8a8a]#h "
set -g window-status-format "#[fg=#8a8a8a] #I:#W "
set -g window-status-current-format "#[fg=#1677a8,bold] #I:#W "
set -g pane-border-style "fg=#e4e4e4"
set -g pane-active-border-style "fg=#1677a8"
set -g message-style "bg=default,fg=#1677a8"
set -g message-command-style "bg=default,fg=#1677a8"
set -g mode-style "bg=#f4e3e3,fg=#202020"
setw -g clock-mode-colour "#1677a8"
