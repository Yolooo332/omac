# Baby Blue White (default) — Generated by scripts/build.mjs from palette.json. Edit the palette, not this file.
# Replaces the [theme] section of ~/.config/herdr/config.toml (install.sh does this).
[theme]
auto_switch = false
name = "one-light"

[theme.custom]
panel_bg = "reset" # let Ghostty's background show through panes
sidebar_bg = "reset"
active_row_bg = "#f4e3e3"
selection_bg = "#f4e3e3"
surface_dim = "#f5f5f5"
surface0 = "reset"
surface1 = "#ebebeb"
overlay0 = "#8a8a8a"
overlay1 = "#606060"
text = "#202020"
subtext0 = "#5b665b"
accent = "#89CFF0"
green = "#448219"
blue = "#1a6fd1"
teal = "#0598bc"
yellow = "#1677a8"
peach = "#c25e00"
red = "#cf3a3a"
mauve = "#d38f8f"
