# Baby Blue (follows the terminal's light/dark) — Generated by scripts/build.mjs from palette.json. Edit the palette, not this file.
# Replaces the [theme] section of ~/.config/herdr/config.toml (install.sh does this).
[theme]
auto_switch = true
dark_name = "vesper"
light_name = "one-light"

[theme.custom]
panel_bg = "reset" # let Ghostty's background show through panes

[theme.custom.dark]
sidebar_bg = "reset"
active_row_bg = "#3d2f2f"
selection_bg = "#3d2f2f"
surface_dim = "#1f1f1f"
surface0 = "reset"
surface1 = "#2a2a2a"
overlay0 = "#808080"
overlay1 = "#aaaaaa"
text = "#e8e8e8"
subtext0 = "#bfc5bf"
accent = "#89CFF0"
green = "#8ccf59"
blue = "#3b8eea"
teal = "#11a8cd"
yellow = "#89CFF0"
peach = "#ff9b21"
red = "#f44747"
mauve = "#d38f8f"

[theme.custom.light]
sidebar_bg = "reset"
active_row_bg = "#f4e3e3"
selection_bg = "#f4e3e3"
surface_dim = "#f5f5f5"
surface0 = "reset"
surface1 = "#ebebeb"
overlay0 = "#8a8a8a"
overlay1 = "#606060"
text = "#202020"
subtext0 = "#5b665b"
accent = "#89CFF0"
green = "#448219"
blue = "#1a6fd1"
teal = "#0598bc"
yellow = "#1677a8"
peach = "#c25e00"
red = "#cf3a3a"
mauve = "#d38f8f"
