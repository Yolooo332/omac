# Omarchy Retro 82 for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#f6dcac"
set -g status-left "#[fg=#05182e,bg=#faa968,bold] #S #[bg=default] "
set -g status-right "#[fg=#faa968]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#2a6b78]#h "
set -g window-status-format "#[fg=#2a6b78] #I:#W "
set -g window-status-current-format "#[fg=#faa968,bold] #I:#W "
set -g pane-border-style "fg=#2a6b78"
set -g pane-active-border-style "fg=#faa968"
set -g message-style "bg=default,fg=#faa968"
set -g message-command-style "bg=default,fg=#faa968"
set -g mode-style "bg=#134e5a,fg=#f6dcac"
setw -g clock-mode-colour "#faa968"
