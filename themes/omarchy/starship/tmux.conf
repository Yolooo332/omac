# Omarchy Starship for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#f5f5f7"
set -g status-left "#[fg=#1c1c1e,bg=#ff9f0a,bold] #S #[bg=default] "
set -g status-right "#[fg=#ff9f0a]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#8e8e93]#h "
set -g window-status-format "#[fg=#8e8e93] #I:#W "
set -g window-status-current-format "#[fg=#ff9f0a,bold] #I:#W "
set -g pane-border-style "fg=#8e8e93"
set -g pane-active-border-style "fg=#ff9f0a"
set -g message-style "bg=default,fg=#ff9f0a"
set -g message-command-style "bg=default,fg=#ff9f0a"
set -g mode-style "bg=#3a3a3c,fg=#ffffff"
setw -g clock-mode-colour "#ff9f0a"
