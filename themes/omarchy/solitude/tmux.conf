# Omarchy Solitude for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#cacccc"
set -g status-left "#[fg=#101315,bg=#798186,bold] #S #[bg=default] "
set -g status-right "#[fg=#798186]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#4b4e55]#h "
set -g window-status-format "#[fg=#4b4e55] #I:#W "
set -g window-status-current-format "#[fg=#798186,bold] #I:#W "
set -g pane-border-style "fg=#4b4e55"
set -g pane-active-border-style "fg=#798186"
set -g message-style "bg=default,fg=#798186"
set -g message-command-style "bg=default,fg=#798186"
set -g mode-style "bg=#343d41,fg=#a5aeb4"
setw -g clock-mode-colour "#798186"
