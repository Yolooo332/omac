# Omarchy Vantablack for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#ffffff"
set -g status-left "#[fg=#000000,bg=#8d8d8d,bold] #S #[bg=default] "
set -g status-right "#[fg=#8d8d8d]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#7a7a7a]#h "
set -g window-status-format "#[fg=#7a7a7a] #I:#W "
set -g window-status-current-format "#[fg=#8d8d8d,bold] #I:#W "
set -g pane-border-style "fg=#7a7a7a"
set -g pane-active-border-style "fg=#8d8d8d"
set -g message-style "bg=default,fg=#8d8d8d"
set -g message-command-style "bg=default,fg=#8d8d8d"
set -g mode-style "bg=#1a1a1a,fg=#ffffff"
setw -g clock-mode-colour "#8d8d8d"
