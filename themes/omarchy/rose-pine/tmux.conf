# Omarchy Rose Pine for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#575279"
set -g status-left "#[fg=#faf4ed,bg=#56949f,bold] #S #[bg=default] "
set -g status-right "#[fg=#56949f]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#cecacd]#h "
set -g window-status-format "#[fg=#cecacd] #I:#W "
set -g window-status-current-format "#[fg=#56949f,bold] #I:#W "
set -g pane-border-style "fg=#cecacd"
set -g pane-active-border-style "fg=#56949f"
set -g message-style "bg=default,fg=#56949f"
set -g message-command-style "bg=default,fg=#56949f"
set -g mode-style "bg=#dfdad9,fg=#575279"
setw -g clock-mode-colour "#56949f"
