# Omarchy Lumon for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#d6e2ee"
set -g status-left "#[fg=#16242d,bg=#8bc9eb,bold] #S #[bg=default] "
set -g status-right "#[fg=#8bc9eb]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#304860]#h "
set -g window-status-format "#[fg=#304860] #I:#W "
set -g window-status-current-format "#[fg=#8bc9eb,bold] #I:#W "
set -g pane-border-style "fg=#304860"
set -g pane-active-border-style "fg=#8bc9eb"
set -g message-style "bg=default,fg=#8bc9eb"
set -g message-command-style "bg=default,fg=#8bc9eb"
set -g mode-style "bg=#243d56,fg=#f2fcff"
setw -g clock-mode-colour "#8bc9eb"
