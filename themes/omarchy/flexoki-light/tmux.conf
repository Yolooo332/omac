# Omarchy Flexoki Light for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#100F0F"
set -g status-left "#[fg=#FFFCF0,bg=#205EA6,bold] #S #[bg=default] "
set -g status-right "#[fg=#205EA6]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#B7B5AC]#h "
set -g window-status-format "#[fg=#B7B5AC] #I:#W "
set -g window-status-current-format "#[fg=#205EA6,bold] #I:#W "
set -g pane-border-style "fg=#B7B5AC"
set -g pane-active-border-style "fg=#205EA6"
set -g message-style "bg=default,fg=#205EA6"
set -g message-command-style "bg=default,fg=#205EA6"
set -g mode-style "bg=#CECDC3,fg=#100F0F"
setw -g clock-mode-colour "#205EA6"
