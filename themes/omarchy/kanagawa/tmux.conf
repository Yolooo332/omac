# Omarchy Kanagawa for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#dcd7ba"
set -g status-left "#[fg=#1f1f28,bg=#dcd7ba,bold] #S #[bg=default] "
set -g status-right "#[fg=#dcd7ba]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#54546D]#h "
set -g window-status-format "#[fg=#54546D] #I:#W "
set -g window-status-current-format "#[fg=#dcd7ba,bold] #I:#W "
set -g pane-border-style "fg=#54546D"
set -g pane-active-border-style "fg=#dcd7ba"
set -g message-style "bg=default,fg=#dcd7ba"
set -g message-command-style "bg=default,fg=#dcd7ba"
set -g mode-style "bg=#363646,fg=#dcd7ba"
setw -g clock-mode-colour "#dcd7ba"
