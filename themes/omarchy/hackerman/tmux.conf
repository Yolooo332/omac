# Omarchy Hackerman for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#ddf7ff"
set -g status-left "#[fg=#0B0C16,bg=#82FB9C,bold] #S #[bg=default] "
set -g status-right "#[fg=#82FB9C]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#2d3450]#h "
set -g window-status-format "#[fg=#2d3450] #I:#W "
set -g window-status-current-format "#[fg=#82FB9C,bold] #I:#W "
set -g pane-border-style "fg=#2d3450"
set -g pane-active-border-style "fg=#82FB9C"
set -g message-style "bg=default,fg=#82FB9C"
set -g message-command-style "bg=default,fg=#82FB9C"
set -g mode-style "bg=#1f253a,fg=#ddf7ff"
setw -g clock-mode-colour "#82FB9C"
