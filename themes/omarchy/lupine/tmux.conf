# Omarchy Lupine for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#212121"
set -g status-left "#[fg=#fafafa,bg=#3264eb,bold] #S #[bg=default] "
set -g status-right "#[fg=#3264eb]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#9e9e9e]#h "
set -g window-status-format "#[fg=#9e9e9e] #I:#W "
set -g window-status-current-format "#[fg=#3264eb,bold] #I:#W "
set -g pane-border-style "fg=#9e9e9e"
set -g pane-active-border-style "fg=#3264eb"
set -g message-style "bg=default,fg=#3264eb"
set -g message-command-style "bg=default,fg=#3264eb"
set -g mode-style "bg=#d0d0d0,fg=#000000"
setw -g clock-mode-colour "#3264eb"
