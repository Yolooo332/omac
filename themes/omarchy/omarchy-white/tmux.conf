# Omarchy Omarchy White for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#000000"
set -g status-left "#[fg=#ffffff,bg=#6e6e6e,bold] #S #[bg=default] "
set -g status-right "#[fg=#6e6e6e]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#808080]#h "
set -g window-status-format "#[fg=#808080] #I:#W "
set -g window-status-current-format "#[fg=#6e6e6e,bold] #I:#W "
set -g pane-border-style "fg=#808080"
set -g pane-active-border-style "fg=#6e6e6e"
set -g message-style "bg=default,fg=#6e6e6e"
set -g message-command-style "bg=default,fg=#6e6e6e"
set -g mode-style "bg=#c0c0c0,fg=#000000"
setw -g clock-mode-colour "#6e6e6e"
