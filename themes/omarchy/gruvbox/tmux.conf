# Omarchy Gruvbox for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#d4be98"
set -g status-left "#[fg=#282828,bg=#7daea3,bold] #S #[bg=default] "
set -g status-right "#[fg=#7daea3]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#665c54]#h "
set -g window-status-format "#[fg=#665c54] #I:#W "
set -g window-status-current-format "#[fg=#7daea3,bold] #I:#W "
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#7daea3"
set -g message-style "bg=default,fg=#7daea3"
set -g message-command-style "bg=default,fg=#7daea3"
set -g mode-style "bg=#504945,fg=#d4be98"
setw -g clock-mode-colour "#7daea3"
