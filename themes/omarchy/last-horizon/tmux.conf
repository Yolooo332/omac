# Omarchy Last Horizon for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#FAFCFB"
set -g status-left "#[fg=#0c0b0c,bg=#b59790,bold] #S #[bg=default] "
set -g status-right "#[fg=#b59790]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#584e51]#h "
set -g window-status-format "#[fg=#584e51] #I:#W "
set -g window-status-current-format "#[fg=#b59790,bold] #I:#W "
set -g pane-border-style "fg=#584e51"
set -g pane-active-border-style "fg=#b59790"
set -g message-style "bg=default,fg=#b59790"
set -g message-command-style "bg=default,fg=#b59790"
set -g mode-style "bg=#584e51,fg=#e2dddc"
setw -g clock-mode-colour "#b59790"
