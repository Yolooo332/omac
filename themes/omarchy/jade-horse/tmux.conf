# Omarchy Jade Horse for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#dfede5"
set -g status-left "#[fg=#142620,bg=#8bcbb1,bold] #S #[bg=default] "
set -g status-right "#[fg=#8bcbb1]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#64887b]#h "
set -g window-status-format "#[fg=#64887b] #I:#W "
set -g window-status-current-format "#[fg=#8bcbb1,bold] #I:#W "
set -g pane-border-style "fg=#64887b"
set -g pane-active-border-style "fg=#8bcbb1"
set -g message-style "bg=default,fg=#8bcbb1"
set -g message-command-style "bg=default,fg=#8bcbb1"
set -g mode-style "bg=#2b5147,fg=#f0faf4"
setw -g clock-mode-colour "#8bcbb1"
