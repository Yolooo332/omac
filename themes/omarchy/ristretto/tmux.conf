# Omarchy Ristretto for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#e6d9db"
set -g status-left "#[fg=#2c2525,bg=#f38d70,bold] #S #[bg=default] "
set -g status-right "#[fg=#f38d70]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#72696a]#h "
set -g window-status-format "#[fg=#72696a] #I:#W "
set -g window-status-current-format "#[fg=#f38d70,bold] #I:#W "
set -g pane-border-style "fg=#72696a"
set -g pane-active-border-style "fg=#f38d70"
set -g message-style "bg=default,fg=#f38d70"
set -g message-command-style "bg=default,fg=#f38d70"
set -g mode-style "bg=#403e41,fg=#e6d9db"
setw -g clock-mode-colour "#f38d70"
