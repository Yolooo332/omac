# Omarchy Matte Black for tmux. Generated by themes/omarchy-themes.py from Omarchy's colors.toml. Re-run it, don't edit this file.
set -g status-style "bg=default,fg=#bebebe"
set -g status-left "#[fg=#121212,bg=#e68e0d,bold] #S #[bg=default] "
set -g status-right "#[fg=#e68e0d]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#333333]#h "
set -g window-status-format "#[fg=#333333] #I:#W "
set -g window-status-current-format "#[fg=#e68e0d,bold] #I:#W "
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#e68e0d"
set -g message-style "bg=default,fg=#e68e0d"
set -g message-command-style "bg=default,fg=#e68e0d"
set -g mode-style "bg=#2a2a2a,fg=#bebebe"
setw -g clock-mode-colour "#e68e0d"
